experiment:
  id: 20261016T110000-dgsw2l-unet-ema-attn
  acronym: dgsw2l
  family: double_gyre_shifting_wind_2layer
  summary: unet-ema-attn
  kind: bigger_jump
  rationale: Nine candidates since the EMA incumbent changed short-lead skill but not the
    chaotic tail that sets eval_mse_mean. The tail's only faithful lever is long-lead covariance
    with the truth, i.e. capturing the basin-scale, low-frequency (gyre-mode) variability
    in phase. Convolutions couple distant parts of the basin only through stacked local operations;
    the coarsest U-Net level (25x12 cells, 256 channels) is small enough for full self-attention.
    Two pre-norm transformer layers with a learned positional embedding there let every coarse
    cell interact with every other in one step (+1.1M parameters), a backbone change aimed
    at global modes rather than local capacity.
  hypothesis: Adding two self-attention layers at the U-Net bottleneck of the EMA incumbent
    raises long-lead covariance with the truth, lowering the 3-seed epochs 30-60 average below
    151.5 and the 3-seed final below 147.0 by more than ~10, with KE and h-std ratios above
    0.9.
  conclusion: 'Rejected. Two self-attention layers at the 25x12 bottleneck (+1.1M params)
    make the model worse: 3-seed finals 162.1 / 157.2 / 180.5 (mean 166.6) and epochs 30-60
    averages 164.8 / 154.6 / 174.7 (mean 164.7) vs the EMA incumbent''s 147.0 / 151.5, with
    worse short-lead error (step-1 1.1-1.4 vs 0.8, step-5 5.8-7.2 vs 3.9) and higher velocity
    MSE (0.0023-0.0025). Global coupling adds capacity that over-fits the 571 training pairs
    rather than capturing predictable basin modes; the tail covariance is unchanged.'
paths:
  training_data: data/double_gyre_shifting_wind_2layer/train/20260408T071500-period40d-duration5000d-2layer.nc
  rollout_dir: data/double_gyre_shifting_wind_2layer/rollout/
  experiment_log: data/double_gyre_shifting_wind_2layer/logs/20261016T110000-dgsw2l-unet-ema-attn.json
  results_csv: data/double_gyre_shifting_wind_2layer/results.csv
runtime:
  seed: 42
  device: auto
  epochs: 60
  smoke_test_epochs: 1
split:
  method: chronological
  train_fraction: 0.8
  eval_fraction: 0.2
inputs:
  state_fields:
  - layer_thickness
  - zonal_velocity_centered
  - meridional_velocity_centered
  layers: 2
  conditioning_fields:
  - surface_wind_stress
  static_fields:
  - train_mean_state
  - coordinates
  - land_mask
training:
  batch_size: 8
  learning_rate: 0.0003
  unroll_steps: 8
  gradient_clip_norm: 1.0
  input_noise_std: 1.0
  ema_decay: 0.998
model:
  type: unet
  hidden_channels: 32
  target_mode: residual
  loss: mse
  mass_conserving: true
  fixed_land_cells: true
  depth: 3
  attention_layers: 2
rollout:
  autoregressive: true
  steps: null
  eval_interval_epochs: 5
  save_outputs: false
metrics:
  primary: eval_mse_mean
  definition: 'Mean over the full held-out rollout of layer-thickness MSE, computed by the
    fixed evaluator in src/evaluation.py. Lower is better.

    '
