experiment:
  id: 20261016T061500-dgsw2l-unet-ema
  acronym: dgsw2l
  family: double_gyre_shifting_wind_2layer
  summary: unet-ema
  kind: tuning
  rationale: 'Checkpoint-to-checkpoint scores of the incumbent swing by +/-20-40 (CUDA control
    epochs 30-60: 129-201), and training loss keeps falling while eval error plateaus, i.e.
    the latest optimiser iterate sits at a noisy, slightly over-fitted point. An exponential
    moving average of the weights (decay 0.998 per optimiser step, ~7-epoch horizon, ~71 steps/epoch)
    is a standard regulariser for autoregressive emulators and generative models: it averages
    over the SGD noise, typically improving generalisation and stabilising rollouts. Run in
    parallel with the Heun experiment on spare RunPod workers.'
  hypothesis: Evaluating with EMA weights (decay 0.998) lowers the 3-seed final eval_mse_mean
    below the CUDA control's 148.9 and the 3-seed epochs 30-60 mean below 167.1 by more than
    ~10, and narrows the spread across scheduled rollouts, with KE and h-std ratios above
    0.9.
  conclusion: 'Supported; promoted to incumbent (three seeds already run). Evaluating with
    an exponential moving average of the weights (decay 0.998 per step) improves every seed
    over the whole late-training sequence: epochs 30-60 averages 156.0 / 148.2 / 150.4 (seeds
    42/7/123; mean 151.5) vs the CUDA control''s 170.2 / 162.8 / 168.4 (mean 167.1), a 15.6-point
    gain, well beyond the ~10-point standard error, with smaller checkpoint-to-checkpoint
    swings (seed 7: 134-157 vs 136-189). Final checkpoints 159.0 / 156.9 / 125.0 (mean 147.0)
    vs 148.9 are level, as expected from single-checkpoint noise. Velocity MSE also improves
    (final 0.0018-0.0026, late-epoch mean ~0.0021 vs ~0.0023). Short-lead skill matches the
    control (step-1 0.7-0.8, step-5 3.9-5.2) and fidelity holds (h-std 0.98-0.99, KE 0.92-0.94
    at epoch 60). Early checkpoints lag (KE 0.4-0.6 at epochs 10-20) because the average still
    includes early weights; irrelevant by epoch 30. Rollout regenerated locally from the seed-42
    checkpoint: 158.5 / 287.1 / 0.00254 (CUDA 159.0).'
paths:
  training_data: data/double_gyre_shifting_wind_2layer/train/20260408T071500-period40d-duration5000d-2layer.nc
  rollout_dir: data/double_gyre_shifting_wind_2layer/rollout/
  experiment_log: data/double_gyre_shifting_wind_2layer/logs/20261016T061500-dgsw2l-unet-ema.json
  results_csv: data/double_gyre_shifting_wind_2layer/results.csv
runtime:
  seed: 42
  device: auto
  epochs: 60
  smoke_test_epochs: 1
split:
  method: chronological
  train_fraction: 0.8
  eval_fraction: 0.2
inputs:
  state_fields:
  - layer_thickness
  - zonal_velocity_centered
  - meridional_velocity_centered
  layers: 2
  conditioning_fields:
  - surface_wind_stress
  static_fields:
  - train_mean_state
  - coordinates
  - land_mask
training:
  batch_size: 8
  learning_rate: 0.0003
  unroll_steps: 8
  gradient_clip_norm: 1.0
  input_noise_std: 1.0
  ema_decay: 0.998
model:
  type: unet
  hidden_channels: 32
  target_mode: residual
  loss: mse
  mass_conserving: true
  fixed_land_cells: true
  depth: 3
rollout:
  autoregressive: true
  steps: null
  eval_interval_epochs: 5
  save_outputs: false
metrics:
  primary: eval_mse_mean
  definition: 'Mean over the full held-out rollout of layer-thickness MSE, computed by the
    fixed evaluator in src/evaluation.py. Lower is better.

    '
