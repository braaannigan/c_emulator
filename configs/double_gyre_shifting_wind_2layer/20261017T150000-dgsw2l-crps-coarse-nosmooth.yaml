experiment:
  id: 20261017T150000-dgsw2l-crps-coarse-nosmooth
  acronym: dgsw2l
  family: double_gyre_shifting_wind_2layer
  summary: crps-coarse-nosmooth
  kind: medium_step
  rationale: Coarse-scale stochastic inputs (scale 4) on the smoothed incumbent gave the best
    realism yet (0.69, grid-noise excess 0.92 decades), suggesting the noise floor came from
    per-cell white-noise inputs. The increment smoothing costs eddy-band power (ratio 0.83-0.93)
    and may be unnecessary once the randomness is coarse. Removing it isolates the coarse-noise
    effect and should recover eddy-scale energy. Local Mac run, seed 42, in parallel with
    the RunPod coarse-noise seed-123 job.
  hypothesis: Coarse noise without increment smoothing keeps the grid-noise excess within
    ~0.3 decades of the smoothed coarse-noise model, raises the held-out eddy-band ratios
    and EKE amplitude, and keeps predictable-range MSE and epochs 30-60 eval_mse_mean within
    seed noise of the incumbent.
  conclusion: null
paths:
  training_data: data/double_gyre_shifting_wind_2layer/train/20260408T071500-period40d-duration5000d-2layer.nc
  rollout_dir: data/double_gyre_shifting_wind_2layer/rollout/
  experiment_log: data/double_gyre_shifting_wind_2layer/logs/20261017T150000-dgsw2l-crps-coarse-nosmooth.json
  results_csv: data/double_gyre_shifting_wind_2layer/results.csv
runtime:
  seed: 42
  device: auto
  epochs: 60
  smoke_test_epochs: 1
split:
  method: chronological
  train_fraction: 0.8
  eval_fraction: 0.2
inputs:
  state_fields:
  - layer_thickness
  - zonal_velocity_centered
  - meridional_velocity_centered
  layers: 2
  conditioning_fields:
  - surface_wind_stress
  static_fields:
  - train_mean_state
  - coordinates
  - land_mask
training:
  batch_size: 8
  learning_rate: 0.0003
  unroll_steps: 8
  gradient_clip_norm: 1.0
  input_noise_std: 1.0
  ema_decay: 0.998
  loss: crps
model:
  type: unet
  hidden_channels: 32
  target_mode: residual
  loss: mse
  mass_conserving: true
  fixed_land_cells: true
  depth: 3
  stochastic_channels: 4
  increment_smoothing: 0.0
  stochastic_scale: 4
rollout:
  autoregressive: true
  steps: null
  eval_interval_epochs: 5
  save_outputs: false
metrics:
  primary: eval_mse_mean
  definition: 'Mean over the full held-out rollout of layer-thickness MSE, computed by the
    fixed evaluator in src/evaluation.py. Lower is better.

    '
