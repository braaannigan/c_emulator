  learning_rate: 0.0003
  unroll_steps: 8
  gradient_clip_norm: 1.0
  input_noise_std: 1.0
  ema_decay: 0.998
  channel_loss_weights:
  - 2.5
  - 2.5
  - 0.25
  - 0.25
  - 0.25
  - 0.25
model:
  type: unet
  hidden_channels: 32
  target_mode: residual
  loss: mse
  mass_conserving: true
  fixed_land_cells: true
  depth: 3
rollout:
