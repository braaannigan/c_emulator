experiment:
  id: 20261016T073000-dgsw2l-unet-ema9995
  acronym: dgsw2l
  family: double_gyre_shifting_wind_2layer
  summary: unet-ema9995
  kind: tuning
  rationale: EMA at decay 0.998 (~7-epoch averaging horizon) gave the incumbent's gain by
    averaging over SGD noise. Checkpoint-to-checkpoint swings of the EMA model remain ~+/-15,
    and late-epoch weights still drift (training loss falling), so a longer average (decay
    0.9995, ~28-epoch horizon) may average over more of that wandering. Single-parameter tuning
    around the new incumbent, three seeds in parallel.
  hypothesis: Raising the EMA decay from 0.998 to 0.9995 lowers the 3-seed epochs 30-60 average
    below the incumbent's 151.5 and the 3-seed final below 147.0 by more than ~10, while keeping
    KE and h-std ratios above 0.9 at epochs 40-60 (the longer average lags more early on).
  conclusion: 'Rejected. With decay 0.9995 (~28-epoch horizon) the averaged weights still
    mix in weights from early training even at epoch 60, and averaging very different networks
    yields an over-smoothed model: step-1 MSE 8-9 (vs 0.8), KE ratio 0.30-0.45 and h-std 0.79-0.95
    (lost eddy energy), so the rollout behaves like a damped climatology-seeking model. Scores
    192.1 / 172.3 / 195.7 final (mean 186.7) and 200.3 / 187.4 / 213.6 over epochs 30-60 (mean
    200.4) vs the incumbent''s 147.0 / 151.5. The averaging horizon must be short compared
    with the training run; 0.998 (~7 epochs) is near the useful range.'
paths:
  training_data: data/double_gyre_shifting_wind_2layer/train/20260408T071500-period40d-duration5000d-2layer.nc
  rollout_dir: data/double_gyre_shifting_wind_2layer/rollout/
  experiment_log: data/double_gyre_shifting_wind_2layer/logs/20261016T073000-dgsw2l-unet-ema9995.json
  results_csv: data/double_gyre_shifting_wind_2layer/results.csv
runtime:
  seed: 42
  device: auto
  epochs: 60
  smoke_test_epochs: 1
split:
  method: chronological
  train_fraction: 0.8
  eval_fraction: 0.2
inputs:
  state_fields:
  - layer_thickness
  - zonal_velocity_centered
  - meridional_velocity_centered
  layers: 2
  conditioning_fields:
  - surface_wind_stress
  static_fields:
  - train_mean_state
  - coordinates
  - land_mask
training:
  batch_size: 8
  learning_rate: 0.0003
  unroll_steps: 8
  gradient_clip_norm: 1.0
  input_noise_std: 1.0
  ema_decay: 0.9995
model:
  type: unet
  hidden_channels: 32
  target_mode: residual
  loss: mse
  mass_conserving: true
  fixed_land_cells: true
  depth: 3
rollout:
  autoregressive: true
  steps: null
  eval_interval_epochs: 5
  save_outputs: false
metrics:
  primary: eval_mse_mean
  definition: 'Mean over the full held-out rollout of layer-thickness MSE, computed by the
    fixed evaluator in src/evaluation.py. Lower is better.

    '
