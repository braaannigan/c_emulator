experiment:
  id: 20261015T183000-dgsw2l-land-mask
  acronym: dgsw2l
  family: double_gyre_shifting_wind_2layer
  summary: land-mask
  kind: bigger_jump
  rationale: The rollout blow-up of the static-context model starts at the side walls, which
    in this dataset are a land ring (rows 0,1,198,199 and alternate rows of columns 0/99)
    with fixed h=200, u=v=0. The residual CNN lets those cells drift and sees a fixed/varying
    checkerboard it cannot represent, seeding grid-scale growth; mass projection also leaks
    volume into land cells.
  hypothesis: Treating land as a first-class grid object -- pinning the 596 cells that are
    constant over the training split to their fixed values after every step, projecting the
    volume correction over wet cells only, and feeding the land mask as an input channel --
    removes the side-wall instability of the static-context unroll-8 residual mass-conserving
    CNN, yielding stable 143-step rollouts at every scheduled checkpoint with eval_mse_mean
    below climatology (136.8).
  conclusion: 'Not adopted as incumbent (unstable at the end of training) but adopted as the
    base recipe. Pinning the land ring and wet-cell volume projection gives the best early
    rollouts so far (epoch 5: 164.2, the only rollout below persistence besides static-context''s,
    and h-std ratio 0.94) and stays bounded through epoch 25 (311-372), roughly doubling the
    number of stable scheduled rollouts, but divergence still develops from epoch 30 (final
    8.5e7). Diagnosis: the blow-up has moved off the walls into the interior where the western
    boundary current separates (y~182-191, x~9-13) and is grid-scale (79% of error energy
    at |k|>0.25 by step 100). Next: teach the model to damp its own grid-scale errors (noise
    injection).'
paths:
  training_data: data/double_gyre_shifting_wind_2layer/train/20260408T071500-period40d-duration5000d-2layer.nc
  rollout_dir: data/double_gyre_shifting_wind_2layer/rollout/
  experiment_log: data/double_gyre_shifting_wind_2layer/logs/20261015T183000-dgsw2l-land-mask.json
  results_csv: data/double_gyre_shifting_wind_2layer/results.csv
runtime:
  seed: 42
  device: auto
  epochs: 60
  smoke_test_epochs: 1
split:
  method: chronological
  train_fraction: 0.8
  eval_fraction: 0.2
inputs:
  state_fields:
  - layer_thickness
  - zonal_velocity_centered
  - meridional_velocity_centered
  layers: 2
  conditioning_fields:
  - surface_wind_stress
  static_fields:
  - train_mean_state
  - coordinates
  - land_mask
training:
  batch_size: 8
  learning_rate: 0.0003
  unroll_steps: 8
  gradient_clip_norm: 1.0
model:
  type: state_cnn
  hidden_channels: 32
  hidden_layers: 2
  kernel_size: 3
  target_mode: residual
  loss: mse
  mass_conserving: true
  fixed_land_cells: true
rollout:
  autoregressive: true
  steps: null
  eval_interval_epochs: 5
  save_outputs: false
metrics:
  primary: eval_mse_mean
  definition: 'Mean over the full held-out rollout of layer-thickness MSE, computed by the
    fixed evaluator in src/evaluation.py. Lower is better.

    '
