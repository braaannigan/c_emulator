experiment:
  id: 20261016T200000-dgsw2l-latent-rom
  acronym: dgsw2l
  family: double_gyre_shifting_wind_2layer
  summary: latent-rom
  kind: bigger_jump
  rationale: User-chosen realism-preserving bigger jump. All grid-space steppers re-inject
    their errors at grid scale every step; the literature review lists reduced-order latent
    surrogates (POD-GRU, Koopman autoencoders) as the long-horizon stress-test baseline. Here
    a convolutional encoder compresses the state 12x onto a 25x12x32 latent grid, a small
    U-Net steps the latent state forward with pooled wind and static context for the whole
    rollout, and a decoder maps every step back to physical space with land pinned and each
    layer's wet volume restored. Trained end to end on start-state reconstruction plus 8-step
    decoded rollouts, with start-state noise and EMA as in the deterministic incumbent. Single
    seed (42) per the budget rule.
  hypothesis: The latent reduced-order emulator stays bounded with KE and h-std ratios above
    0.85, and its seed-42 epochs 30-60 eval_mse_mean is below the deterministic EMA incumbent's
    seed-42 run (156.0) and within ~6 of the CRPS incumbent's (144.0); a clear win (below
    ~138) would justify more seeds.
  conclusion: 'Failed: unstable. The latent reduced-order emulator (12x compression to 25x12x32,
    latent U-Net stepper, decoder with land pinning and volume restoration) never matches
    the grid-space models at short leads (epoch 60: step-1 MSE 3.1 vs 0.8, limited by reconstruction)
    and its latent dynamics blow up beyond ~20-50 steps at every scheduled rollout from epoch
    15 (final eval_mse_mean 1.0e4, KE ratio up to ~590 at the last step). Start-state noise
    is absorbed by the contractive encoder, so the latent stepper never learns to damp perturbations
    of its own latent state, and 8-step training does not constrain long-horizon latent growth,
    the same failure mode the grid-space models had before noise injection. A follow-up should
    inject noise in latent space.'
paths:
  training_data: data/double_gyre_shifting_wind_2layer/train/20260408T071500-period40d-duration5000d-2layer.nc
  rollout_dir: data/double_gyre_shifting_wind_2layer/rollout/
  experiment_log: data/double_gyre_shifting_wind_2layer/logs/20261016T200000-dgsw2l-latent-rom.json
  results_csv: data/double_gyre_shifting_wind_2layer/results.csv
runtime:
  seed: 42
  device: auto
  epochs: 60
  smoke_test_epochs: 1
split:
  method: chronological
  train_fraction: 0.8
  eval_fraction: 0.2
inputs:
  state_fields:
  - layer_thickness
  - zonal_velocity_centered
  - meridional_velocity_centered
  layers: 2
  conditioning_fields:
  - surface_wind_stress
  static_fields:
  - train_mean_state
  - coordinates
  - land_mask
training:
  batch_size: 8
  learning_rate: 0.0003
  unroll_steps: 8
  gradient_clip_norm: 1.0
  input_noise_std: 1.0
  ema_decay: 0.998
model:
  type: latent
  hidden_channels: 32
  loss: mse
  fixed_land_cells: true
  latent_channels: 32
  latent_levels: 3
  stepper_channels: 64
  stepper_depth: 2
rollout:
  autoregressive: true
  steps: null
  eval_interval_epochs: 5
  save_outputs: false
metrics:
  primary: eval_mse_mean
  definition: 'Mean over the full held-out rollout of layer-thickness MSE, computed by the
    fixed evaluator in src/evaluation.py. Lower is better.

    '
