experiment:
  id: 20261017T130000-dgsw2l-crps-smooth-noema
  acronym: dgsw2l
  family: double_gyre_shifting_wind_2layer
  summary: crps-smooth-noema
  kind: tuning
  rationale: The smoothed CRPS incumbent is under-energetic in the held-out period (interior
    thickness variance 106.6 vs truth 136.5, ratio 0.78; upper-layer EKE map ratio 0.74).
    EMA weight averaging was adopted for the deterministic model to suppress checkpoint noise,
    but for a stochastic generator averaging weights from slightly different generators can
    shrink the spread it produces. Removing EMA (latest iterate) tests whether it is damping
    the members. Local Mac run in parallel with the RunPod coarse-noise job.
  hypothesis: Without EMA the smoothed CRPS model's held-out thickness variance ratio and
    upper-layer EKE map ratio rise above ~0.85 (from 0.73-0.78) while the seed-42 epochs 30-60
    eval_mse_mean stays within ~10 of the incumbent family's 3-seed mean (151.5).
  conclusion: null
paths:
  training_data: data/double_gyre_shifting_wind_2layer/train/20260408T071500-period40d-duration5000d-2layer.nc
  rollout_dir: data/double_gyre_shifting_wind_2layer/rollout/
  experiment_log: data/double_gyre_shifting_wind_2layer/logs/20261017T130000-dgsw2l-crps-smooth-noema.json
  results_csv: data/double_gyre_shifting_wind_2layer/results.csv
runtime:
  seed: 42
  device: auto
  epochs: 60
  smoke_test_epochs: 1
split:
  method: chronological
  train_fraction: 0.8
  eval_fraction: 0.2
inputs:
  state_fields:
  - layer_thickness
  - zonal_velocity_centered
  - meridional_velocity_centered
  layers: 2
  conditioning_fields:
  - surface_wind_stress
  static_fields:
  - train_mean_state
  - coordinates
  - land_mask
training:
  batch_size: 8
  learning_rate: 0.0003
  unroll_steps: 8
  gradient_clip_norm: 1.0
  input_noise_std: 1.0
  loss: crps
model:
  type: unet
  hidden_channels: 32
  target_mode: residual
  loss: mse
  mass_conserving: true
  fixed_land_cells: true
  depth: 3
  stochastic_channels: 4
  increment_smoothing: 1.0
rollout:
  autoregressive: true
  steps: null
  eval_interval_epochs: 5
  save_outputs: false
metrics:
  primary: eval_mse_mean
  definition: 'Mean over the full held-out rollout of layer-thickness MSE, computed by the
    fixed evaluator in src/evaluation.py. Lower is better.

    '
