experiment:
  id: 20261017T180000-dgsw2l-crps-coarse8-ch8
  acronym: dgsw2l
  family: double_gyre_shifting_wind_2layer
  summary: crps-coarse8-ch8
  kind: tuning
  rationale: With noise drawn 8x coarser the remaining realism gap is too little eddy energy
    in the held-out period (upper-layer EKE map ratio ~0.75). With per-cell noise, 8 channels
    instead of 4 changed nothing, but at the coarse scale each channel carries much less information
    (25x13 values), so more channels may give the generator enough mesoscale randomness to
    express full eddy variance. RunPod, seed 42, with diagnostics, in parallel with the local
    seed-123 run of the 8x model.
  hypothesis: Eight coarse noise channels raise the held-out upper-layer EKE map ratio above
    ~0.85 and keep realism at or below ~0.72, predictable-range MSE within ~1 of 17.1 and
    eval_mse_mean within seed noise of the 8x model.
  conclusion: 'Not adopted (hypothesis target missed; single seed). Eight coarse noise channels
    (seed 42) do not raise held-out eddy energy (upper-layer EKE map ratio 0.73 vs 0.75 with
    4 channels) - the stated target - although short-range skill and the benchmark improve
    for this seed (predictable-range MSE 15.9 vs 17.7, epochs 30-60 147 vs 153, final 156
    vs 151) while realism and drift worsen slightly (0.78 vs 0.75; 0.18 vs 0.12). Across all
    models the held-out upper-layer EKE ratio sits at 0.73-0.83 while the 25-year runs reach
    0.90-0.93 of the full record, and the held-out period is more energetic than the training
    climate (thickness variance 136 vs 125): the held-out EKE deficit largely reflects a free
    run relaxing to the model climate from an energetic period, which no emulator without
    eval-period information can match. Seed 7 (recovered from the volume after the API lost
    the job) removes the short-range gain: 2-seed predictable-range MSE 17.4 vs 17.5 for the
    8x incumbent (4 seeds), realism 0.76 vs 0.70, epochs 30-60 / final 150 / 159 vs 152.5
    / 157.6, drift 0.12. Neutral; keep 4 channels.'
paths:
  training_data: data/double_gyre_shifting_wind_2layer/train/20260408T071500-period40d-duration5000d-2layer.nc
  rollout_dir: data/double_gyre_shifting_wind_2layer/rollout/
  experiment_log: data/double_gyre_shifting_wind_2layer/logs/20261017T180000-dgsw2l-crps-coarse8-ch8.json
  results_csv: data/double_gyre_shifting_wind_2layer/results.csv
runtime:
  seed: 42
  device: auto
  epochs: 60
  smoke_test_epochs: 1
split:
  method: chronological
  train_fraction: 0.8
  eval_fraction: 0.2
inputs:
  state_fields:
  - layer_thickness
  - zonal_velocity_centered
  - meridional_velocity_centered
  layers: 2
  conditioning_fields:
  - surface_wind_stress
  static_fields:
  - train_mean_state
  - coordinates
  - land_mask
training:
  batch_size: 8
  learning_rate: 0.0003
  unroll_steps: 8
  gradient_clip_norm: 1.0
  input_noise_std: 1.0
  ema_decay: 0.998
  loss: crps
model:
  type: unet
  hidden_channels: 32
  target_mode: residual
  loss: mse
  mass_conserving: true
  fixed_land_cells: true
  depth: 3
  stochastic_channels: 8
  increment_smoothing: 1.0
  stochastic_scale: 8
rollout:
  autoregressive: true
  steps: null
  eval_interval_epochs: 5
  save_outputs: false
metrics:
  primary: eval_mse_mean
  definition: 'Mean over the full held-out rollout of layer-thickness MSE, computed by the
    fixed evaluator in src/evaluation.py. Lower is better.

    '
