experiment:
  id: 20261016T090000-dgsw2l-unet-ema-advect-seed123
  acronym: dgsw2l
  family: double_gyre_shifting_wind_2layer
  summary: unet-ema-advect-seed123
  kind: tuning
  rationale: Seed replica of 20261016T090000-dgsw2l-unet-ema-advect, run in parallel.
  hypothesis: Adding the 3.5-day semi-Lagrangian advected state as input channels to the EMA
    incumbent lowers short- and mid-lead error (step-5/10/20) and gives a 3-seed epochs 30-60
    average below 151.5 and a 3-seed final below 147.0 by more than ~10, with KE and h-std
    ratios above 0.9.
  conclusion: null
paths:
  training_data: data/double_gyre_shifting_wind_2layer/train/20260408T071500-period40d-duration5000d-2layer.nc
  rollout_dir: data/double_gyre_shifting_wind_2layer/rollout/
  experiment_log: data/double_gyre_shifting_wind_2layer/logs/20261016T090000-dgsw2l-unet-ema-advect-seed123.json
  results_csv: data/double_gyre_shifting_wind_2layer/results.csv
runtime:
  seed: 123
  device: auto
  epochs: 60
  smoke_test_epochs: 1
split:
  method: chronological
  train_fraction: 0.8
  eval_fraction: 0.2
inputs:
  state_fields:
  - layer_thickness
  - zonal_velocity_centered
  - meridional_velocity_centered
  layers: 2
  conditioning_fields:
  - surface_wind_stress
  static_fields:
  - train_mean_state
  - coordinates
  - land_mask
training:
  batch_size: 8
  learning_rate: 0.0003
  unroll_steps: 8
  gradient_clip_norm: 1.0
  input_noise_std: 1.0
  ema_decay: 0.998
model:
  type: unet
  hidden_channels: 32
  target_mode: residual
  loss: mse
  mass_conserving: true
  fixed_land_cells: true
  depth: 3
  advection_prior:
    dt_seconds: 302400.0
    dx_metres: 10000.0
    substeps: 7
rollout:
  autoregressive: true
  steps: null
  eval_interval_epochs: 5
  save_outputs: false
metrics:
  primary: eval_mse_mean
  definition: 'Mean over the full held-out rollout of layer-thickness MSE, computed by the
    fixed evaluator in src/evaluation.py. Lower is better.

    '
