experiment:
  id: 20261015T204500-dgsw2l-unet-multiscale
  acronym: dgsw2l
  family: double_gyre_shifting_wind_2layer
  summary: unet-multiscale
  kind: bigger_jump
  rationale: The incumbent CNN explains only ~20% of the one-step increment variance (step-1
    MSE 7.8 vs ~9.6 for persistence). At 7-day sampling, eddies and boundary currents move
    up to ~30 cells per step (0.5 m/s x 7 d = 300 km), while the incumbent's receptive field
    is ~9 cells, so it cannot see the upstream source of most of the change.
  hypothesis: Replacing the local CNN with a 3-level U-Net (32/64/128/256 channels, 2x average
    pooling per level, receptive field covering ~70+ cells) inside the same stable recipe
    (residual, volume projection, pinned land, static context, 8-step unroll, noise injection)
    markedly improves short- and mid-lead skill (step-1 and step-10 MSE) while staying bounded
    at every scheduled rollout, lowering final eval_mse_mean below the incumbent's 215.7.
  conclusion: 'Supported: large gain in predictive skill, candidate incumbent pending seed
    check. The 3-level U-Net inside the incumbent recipe stays bounded in all 12 scheduled
    rollouts and cuts lead-time error several-fold: step-1 0.9 (vs 7.8), step-5 11 (vs 54),
    step-10 19.5 (vs 60), step-20 24.7 (vs 99). Final eval_mse_mean 155.8 / last 332.5 / vel
    0.00228 vs 215.7 / 393.6 / 0.00258; mean over epochs 30-60 is 166 vs ~215 for the incumbent,
    so the gain is consistent, not one lucky checkpoint. Physical fidelity also improves (KE
    ratio 0.91-0.98 vs ~0.78; h-std ratio 0.93-0.99). Long-lead error still saturates near
    2x climate variance after ~50 steps, so eval_mse_mean is now dominated by the chaotic
    tail; the epoch-to-epoch spread (138-208) reflects which eddy realisation the free run
    lands on. Training loss is still falling (0.63), so longer training may help further.'
paths:
  training_data: data/double_gyre_shifting_wind_2layer/train/20260408T071500-period40d-duration5000d-2layer.nc
  rollout_dir: data/double_gyre_shifting_wind_2layer/rollout/
  experiment_log: data/double_gyre_shifting_wind_2layer/logs/20261015T204500-dgsw2l-unet-multiscale.json
  results_csv: data/double_gyre_shifting_wind_2layer/results.csv
runtime:
  seed: 42
  device: auto
  epochs: 60
  smoke_test_epochs: 1
split:
  method: chronological
  train_fraction: 0.8
  eval_fraction: 0.2
inputs:
  state_fields:
  - layer_thickness
  - zonal_velocity_centered
  - meridional_velocity_centered
  layers: 2
  conditioning_fields:
  - surface_wind_stress
  static_fields:
  - train_mean_state
  - coordinates
  - land_mask
training:
  batch_size: 8
  learning_rate: 0.0003
  unroll_steps: 8
  gradient_clip_norm: 1.0
  input_noise_std: 1.0
model:
  type: unet
  hidden_channels: 32
  target_mode: residual
  loss: mse
  mass_conserving: true
  fixed_land_cells: true
  depth: 3
rollout:
  autoregressive: true
  steps: null
  eval_interval_epochs: 5
  save_outputs: false
metrics:
  primary: eval_mse_mean
  definition: 'Mean over the full held-out rollout of layer-thickness MSE, computed by the
    fixed evaluator in src/evaluation.py. Lower is better.

    '
