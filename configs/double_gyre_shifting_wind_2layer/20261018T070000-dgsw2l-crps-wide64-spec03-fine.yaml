experiment:
  acronym: dgsw2l
  conclusion: 'Promising; seed check queued. Seed 42: restricting the spectral term to wavelengths
    < 16 cells gives the best spec03 realism, 0.557 (always-on full-band 0.573, incumbent
    seed 42 0.682; noise excess 0.81), with predictable-range MSE 16.9 (17.7 / 15.8), epochs
    30-60 MSE 147 (153 / 141), final 158 (160 / 155), drift 0.008. Less skill recovered than
    the curriculum variant; the two could be combined.'
  family: double_gyre_shifting_wind_2layer
  hypothesis: 'A fine-scale-only spectral term (|k| >= 1/16) keeps predictable-range MSE within
    ~0.5 of the incumbent (seed 42: 15.8) while lowering noise excess and spectral error,
    giving seed-42 realism below ~0.64.'
  id: 20261018T070000-dgsw2l-crps-wide64-spec03-fine
  kind: medium_step
  rationale: Spectral weight 0.3 improves realism but costs skill; much of the skill cost
    may come from forcing energy into large and eddy scales where pointwise skill lives. Restricting
    the penalty to wavelengths below 16 cells (|k| >= 1/16 cycles per cell) targets the grid-noise
    excess and small-scale spectral error while leaving larger scales to CRPS.
  summary: crps-wide64-spec03-fine
inputs:
  conditioning_fields:
  - surface_wind_stress
  layers: 2
  state_fields:
  - layer_thickness
  - zonal_velocity_centered
  - meridional_velocity_centered
  static_fields:
  - train_mean_state
  - coordinates
  - land_mask
metrics:
  definition: 'Mean over the full held-out rollout of layer-thickness MSE, computed by the
    fixed evaluator in src/evaluation.py. Lower is better.

    '
  primary: eval_mse_mean
model:
  depth: 3
  fixed_land_cells: true
  hidden_channels: 64
  increment_smoothing: 1.0
  loss: mse
  mass_conserving: true
  stochastic_channels: 4
  stochastic_scale: 8
  target_mode: residual
  type: unet
paths:
  experiment_log: data/double_gyre_shifting_wind_2layer/logs/20261018T070000-dgsw2l-crps-wide64-spec03-fine.json
  results_csv: data/double_gyre_shifting_wind_2layer/results.csv
  rollout_dir: data/double_gyre_shifting_wind_2layer/rollout/
  training_data: data/double_gyre_shifting_wind_2layer/train/20260408T071500-period40d-duration5000d-2layer.nc
rollout:
  autoregressive: true
  eval_interval_epochs: 5
  save_outputs: false
  steps: null
runtime:
  device: auto
  epochs: 60
  seed: 42
  smoke_test_epochs: 1
split:
  eval_fraction: 0.2
  method: chronological
  train_fraction: 0.8
training:
  batch_size: 8
  ema_decay: 0.998
  gradient_clip_norm: 1.0
  input_noise_std: 1.0
  learning_rate: 0.0003
  loss: crps
  spectral_loss_weight: 0.3
  unroll_steps: 8
  spectral_loss_min_wavenumber: 0.0625
