experiment:
  acronym: dgsw2l
  conclusion: 'Not promoted; past the useful range. Weight 1.0 (seed 42) gives the best realism
    so far, 0.484 (weight 0.3: 0.573, 0.1: 0.655, 0: 0.682 on seed 42), with drift 0.002,
    but predictable-range MSE 18.7 and epochs 30-60 MSE 167 / final 170 (incumbent seed 42:
    15.8 / 141 / 155). The spectral weight trades skill for realism roughly linearly; next
    try to keep realism while recovering skill (curriculum and fine-scale-only variants).'
  family: double_gyre_shifting_wind_2layer
  hypothesis: Spectral weight 1.0 lowers seed-42 realism further (below ~0.5) with predictable-range
    MSE below ~20; if skill collapses, 0.3 is near the useful maximum.
  id: 20261018T060000-dgsw2l-crps-wide64-spec10
  kind: tuning
  rationale: Spectral loss weights 0.1 and 0.3 improved every realism component monotonically
    (realism 0.704 -> 0.661 -> 0.556 on held-out diagnostics) at a growing cost in predictable-range
    MSE (14.8 -> 15.9 -> 17.2). Weight 1.0 maps where the trade-off saturates or breaks.
  summary: crps-wide64-spec10
inputs:
  conditioning_fields:
  - surface_wind_stress
  layers: 2
  state_fields:
  - layer_thickness
  - zonal_velocity_centered
  - meridional_velocity_centered
  static_fields:
  - train_mean_state
  - coordinates
  - land_mask
metrics:
  definition: 'Mean over the full held-out rollout of layer-thickness MSE, computed by the
    fixed evaluator in src/evaluation.py. Lower is better.

    '
  primary: eval_mse_mean
model:
  depth: 3
  fixed_land_cells: true
  hidden_channels: 64
  increment_smoothing: 1.0
  loss: mse
  mass_conserving: true
  stochastic_channels: 4
  stochastic_scale: 8
  target_mode: residual
  type: unet
paths:
  experiment_log: data/double_gyre_shifting_wind_2layer/logs/20261018T060000-dgsw2l-crps-wide64-spec10.json
  results_csv: data/double_gyre_shifting_wind_2layer/results.csv
  rollout_dir: data/double_gyre_shifting_wind_2layer/rollout/
  training_data: data/double_gyre_shifting_wind_2layer/train/20260408T071500-period40d-duration5000d-2layer.nc
rollout:
  autoregressive: true
  eval_interval_epochs: 5
  save_outputs: false
  steps: null
runtime:
  device: auto
  epochs: 60
  seed: 42
  smoke_test_epochs: 1
split:
  eval_fraction: 0.2
  method: chronological
  train_fraction: 0.8
training:
  batch_size: 8
  ema_decay: 0.998
  gradient_clip_norm: 1.0
  input_noise_std: 1.0
  learning_rate: 0.0003
  loss: crps
  spectral_loss_weight: 1.0
  unroll_steps: 8
