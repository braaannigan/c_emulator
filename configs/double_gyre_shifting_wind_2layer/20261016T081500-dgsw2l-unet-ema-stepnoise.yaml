experiment:
  id: 20261016T081500-dgsw2l-unet-ema-stepnoise
  acronym: dgsw2l
  family: double_gyre_shifting_wind_2layer
  summary: unet-ema-stepnoise
  kind: medium_step
  rationale: 'Longer training (unroll16, 100 epochs, depth 4) consistently sharpens short
    leads but worsens the tail: the model over-fits the clean training trajectories. Noise
    injection on the window start was what first made rollouts stable, but the model only
    ever learns to correct one perturbation from clean truth; in a free run its own errors
    re-enter at every step. Perturbing the model''s own prediction before each later unrolled
    step (0.5 increment-std) changes the training objective to one of correcting errors along
    the whole window, a regulariser aimed at the over-fitting and at mid-lead error growth.'
  hypothesis: Adding 0.5 increment-std noise to the model's own prediction before each later
    unrolled step, on top of the EMA incumbent, lowers the 3-seed epochs 30-60 average below
    151.5 and the 3-seed final below 147.0 by more than ~10, with KE and h-std ratios staying
    above 0.9 (some extra smoothing expected).
  conclusion: null
paths:
  training_data: data/double_gyre_shifting_wind_2layer/train/20260408T071500-period40d-duration5000d-2layer.nc
  rollout_dir: data/double_gyre_shifting_wind_2layer/rollout/
  experiment_log: data/double_gyre_shifting_wind_2layer/logs/20261016T081500-dgsw2l-unet-ema-stepnoise.json
  results_csv: data/double_gyre_shifting_wind_2layer/results.csv
runtime:
  seed: 42
  device: auto
  epochs: 60
  smoke_test_epochs: 1
split:
  method: chronological
  train_fraction: 0.8
  eval_fraction: 0.2
inputs:
  state_fields:
  - layer_thickness
  - zonal_velocity_centered
  - meridional_velocity_centered
  layers: 2
  conditioning_fields:
  - surface_wind_stress
  static_fields:
  - train_mean_state
  - coordinates
  - land_mask
training:
  batch_size: 8
  learning_rate: 0.0003
  unroll_steps: 8
  gradient_clip_norm: 1.0
  input_noise_std: 1.0
  ema_decay: 0.998
  step_noise_std: 0.5
model:
  type: unet
  hidden_channels: 32
  target_mode: residual
  loss: mse
  mass_conserving: true
  fixed_land_cells: true
  depth: 3
rollout:
  autoregressive: true
  steps: null
  eval_interval_epochs: 5
  save_outputs: false
metrics:
  primary: eval_mse_mean
  definition: 'Mean over the full held-out rollout of layer-thickness MSE, computed by the
    fixed evaluator in src/evaluation.py. Lower is better.

    '
