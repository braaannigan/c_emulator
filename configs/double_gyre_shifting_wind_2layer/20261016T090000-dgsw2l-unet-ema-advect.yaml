experiment:
  id: 20261016T090000-dgsw2l-unet-ema-advect
  acronym: dgsw2l
  family: double_gyre_shifting_wind_2layer
  summary: unet-ema-advect
  kind: bigger_jump
  rationale: 'Between 7-day snapshots the upper-layer flow carries water up to ~29 cells (p99
    0.48 m/s, 10 km cells), and two-frame and depth-4 attempts to let the network infer motion
    over-fitted. Instead give it an explicit physics prior: each layer''s state carried along
    its own frozen velocity field by semi-Lagrangian back-tracing (7 sub-steps). On training
    data, advecting for half the interval (3.5 days) already beats persistence as a next-step
    thickness guess (MSE 8.0 vs 11.2), while full 7-day frozen-field advection overshoots
    (13.6-92) because thickness fronts propagate slower than the fluid. Supplying the 3.5-day
    advected state as six extra input channels changes the physical formulation of the step
    without changing the target, loss or backbone.'
  hypothesis: Adding the 3.5-day semi-Lagrangian advected state as input channels to the EMA
    incumbent lowers short- and mid-lead error (step-5/10/20) and gives a 3-seed epochs 30-60
    average below 151.5 and a 3-seed final below 147.0 by more than ~10, with KE and h-std
    ratios above 0.9.
  conclusion: 'Rejected. Supplying the 3.5-day semi-Lagrangian advected state as six extra
    input channels does not help: 3-seed finals 170.4 / 166.5 / 175.1 (mean 170.7) and epochs
    30-60 averages 165.8 / 160.0 / 161.5 (mean 162.4) vs the EMA incumbent''s 147.0 / 151.5.
    Short-lead skill is unchanged (step-1 0.7-0.8, step-5 3.9-4.4) and step-10/20 is slightly
    worse (16-21 vs 14-18), so the U-Net already extracts the motion information that frozen-field
    advection provides; the extra channels add over-fitting capacity. Velocity MSE is marginally
    lower (0.0020 vs 0.0021) and fidelity unchanged (KE 0.93-0.96). Runs need CUDA (grid_sample
    backward is missing on MPS; local smoke used PYTORCH_ENABLE_MPS_FALLBACK=1).'
paths:
  training_data: data/double_gyre_shifting_wind_2layer/train/20260408T071500-period40d-duration5000d-2layer.nc
  rollout_dir: data/double_gyre_shifting_wind_2layer/rollout/
  experiment_log: data/double_gyre_shifting_wind_2layer/logs/20261016T090000-dgsw2l-unet-ema-advect.json
  results_csv: data/double_gyre_shifting_wind_2layer/results.csv
runtime:
  seed: 42
  device: auto
  epochs: 60
  smoke_test_epochs: 1
split:
  method: chronological
  train_fraction: 0.8
  eval_fraction: 0.2
inputs:
  state_fields:
  - layer_thickness
  - zonal_velocity_centered
  - meridional_velocity_centered
  layers: 2
  conditioning_fields:
  - surface_wind_stress
  static_fields:
  - train_mean_state
  - coordinates
  - land_mask
training:
  batch_size: 8
  learning_rate: 0.0003
  unroll_steps: 8
  gradient_clip_norm: 1.0
  input_noise_std: 1.0
  ema_decay: 0.998
model:
  type: unet
  hidden_channels: 32
  target_mode: residual
  loss: mse
  mass_conserving: true
  fixed_land_cells: true
  depth: 3
  advection_prior:
    dt_seconds: 302400.0
    dx_metres: 10000.0
    substeps: 7
rollout:
  autoregressive: true
  steps: null
  eval_interval_epochs: 5
  save_outputs: false
metrics:
  primary: eval_mse_mean
  definition: 'Mean over the full held-out rollout of layer-thickness MSE, computed by the
    fixed evaluator in src/evaluation.py. Lower is better.

    '
