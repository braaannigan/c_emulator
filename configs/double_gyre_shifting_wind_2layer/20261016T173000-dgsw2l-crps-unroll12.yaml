experiment:
  id: 20261016T173000-dgsw2l-crps-unroll12
  acronym: dgsw2l
  family: double_gyre_shifting_wind_2layer
  summary: crps-unroll12
  kind: medium_step
  rationale: 'With MSE training, a longer unroll (16) hurt because the late-window gradient
    pushes the conditional mean toward blur and halves the updates. CRPS does not reward blurring:
    the loss for diverging members is satisfied by correct spread. So a longer horizon (12
    steps, 84 days) may now teach mid-lead dynamics without the smoothing penalty, targeting
    the step-10 to step-50 error that sets the score.'
  hypothesis: Training the CRPS incumbent on 12-step unrolls lowers the 3-seed epochs 30-60
    mean below ~140 (incumbent 145.4 +/- 1.3) and step-20 error below 15, keeping KE ratio
    at the last step at or above 0.86.
  conclusion: 'Rejected. 12-step unrolls with CRPS: 3-seed epochs 30-60 154.4 / 157.8 / 151.5
    (mean 154.6) and finals 148.7 / 171.5 / 166.2 (mean 162.1) vs the CRPS incumbent''s 145.4
    / 151.1, with lower KE at the last step (0.80-0.86) and 1.5x run time (10-20 min). Even
    without the blurring incentive of MSE, longer unrolls trade update count and short-lead
    fit for nothing at mid leads. Keep 8 steps.'
paths:
  training_data: data/double_gyre_shifting_wind_2layer/train/20260408T071500-period40d-duration5000d-2layer.nc
  rollout_dir: data/double_gyre_shifting_wind_2layer/rollout/
  experiment_log: data/double_gyre_shifting_wind_2layer/logs/20261016T173000-dgsw2l-crps-unroll12.json
  results_csv: data/double_gyre_shifting_wind_2layer/results.csv
runtime:
  seed: 42
  device: auto
  epochs: 60
  smoke_test_epochs: 1
split:
  method: chronological
  train_fraction: 0.8
  eval_fraction: 0.2
inputs:
  state_fields:
  - layer_thickness
  - zonal_velocity_centered
  - meridional_velocity_centered
  layers: 2
  conditioning_fields:
  - surface_wind_stress
  static_fields:
  - train_mean_state
  - coordinates
  - land_mask
training:
  batch_size: 8
  learning_rate: 0.0003
  unroll_steps: 12
  gradient_clip_norm: 1.0
  input_noise_std: 1.0
  ema_decay: 0.998
  loss: crps
model:
  type: unet
  hidden_channels: 32
  target_mode: residual
  loss: mse
  mass_conserving: true
  fixed_land_cells: true
  depth: 3
  stochastic_channels: 4
rollout:
  autoregressive: true
  steps: null
  eval_interval_epochs: 5
  save_outputs: false
metrics:
  primary: eval_mse_mean
  definition: 'Mean over the full held-out rollout of layer-thickness MSE, computed by the
    fixed evaluator in src/evaluation.py. Lower is better.

    '
