experiment:
  id: 20261017T090000-dgsw2l-crps-smooth-increment-seed11
  acronym: dgsw2l
  family: double_gyre_shifting_wind_2layer
  summary: crps-smooth-increment-seed11
  kind: tuning
  rationale: Fourth seed of the incumbent, run locally on the Mac, for a seed-matched 4-vs-4
    comparison with the 8x coarse-noise candidate (its seed 11 runs on RunPod); the incumbent's
    3-seed final mean (143) leans on one low seed.
  hypothesis: See 20261017T090000-dgsw2l-crps-smooth-increment.
  conclusion: null
paths:
  training_data: data/double_gyre_shifting_wind_2layer/train/20260408T071500-period40d-duration5000d-2layer.nc
  rollout_dir: data/double_gyre_shifting_wind_2layer/rollout/
  experiment_log: data/double_gyre_shifting_wind_2layer/logs/20261017T090000-dgsw2l-crps-smooth-increment-seed11.json
  results_csv: data/double_gyre_shifting_wind_2layer/results.csv
runtime:
  seed: 11
  device: auto
  epochs: 60
  smoke_test_epochs: 1
split:
  method: chronological
  train_fraction: 0.8
  eval_fraction: 0.2
inputs:
  state_fields:
  - layer_thickness
  - zonal_velocity_centered
  - meridional_velocity_centered
  layers: 2
  conditioning_fields:
  - surface_wind_stress
  static_fields:
  - train_mean_state
  - coordinates
  - land_mask
training:
  batch_size: 8
  learning_rate: 0.0003
  unroll_steps: 8
  gradient_clip_norm: 1.0
  input_noise_std: 1.0
  ema_decay: 0.998
  loss: crps
model:
  type: unet
  hidden_channels: 32
  target_mode: residual
  loss: mse
  mass_conserving: true
  fixed_land_cells: true
  depth: 3
  stochastic_channels: 4
  increment_smoothing: 1.0
rollout:
  autoregressive: true
  steps: null
  eval_interval_epochs: 5
  save_outputs: false
metrics:
  primary: eval_mse_mean
  definition: 'Mean over the full held-out rollout of layer-thickness MSE, computed by the
    fixed evaluator in src/evaluation.py. Lower is better.

    '
