experiment:
  id: 20261015T220000-dgsw2l-unet-multiscale-seed7
  acronym: dgsw2l
  family: double_gyre_shifting_wind_2layer
  summary: unet-multiscale-seed7
  kind: tuning
  rationale: Seed check required before promoting the U-Net (bigger_jump) to incumbent.
  hypothesis: 'The U-Net recipe is seed-robust: with seed 7 all scheduled rollouts stay bounded,
    short-lead skill matches seed 42 (step-1 ~1, step-10 ~20), and the final eval_mse_mean
    is below the incumbent''s 215.7.'
  conclusion: Seed check passed. Seed 7 stays bounded in all 12 scheduled rollouts, reproduces
    the short-lead skill (step-1 0.8, step-10 14.9, step-20 24.7) and ends at 148.0 / 342.8
    / vel 0.00183 vs seed 42's 155.8 / 332.5 / 0.00228; epochs 30-60 average ~167 for both
    seeds. The U-Net recipe is promoted to incumbent (seed-42 run as the reference; two-seed
    final mean 151.9, vs 212.5 for the previous incumbent).
paths:
  training_data: data/double_gyre_shifting_wind_2layer/train/20260408T071500-period40d-duration5000d-2layer.nc
  rollout_dir: data/double_gyre_shifting_wind_2layer/rollout/
  experiment_log: data/double_gyre_shifting_wind_2layer/logs/20261015T220000-dgsw2l-unet-multiscale-seed7.json
  results_csv: data/double_gyre_shifting_wind_2layer/results.csv
runtime:
  seed: 7
  device: auto
  epochs: 60
  smoke_test_epochs: 1
split:
  method: chronological
  train_fraction: 0.8
  eval_fraction: 0.2
inputs:
  state_fields:
  - layer_thickness
  - zonal_velocity_centered
  - meridional_velocity_centered
  layers: 2
  conditioning_fields:
  - surface_wind_stress
  static_fields:
  - train_mean_state
  - coordinates
  - land_mask
training:
  batch_size: 8
  learning_rate: 0.0003
  unroll_steps: 8
  gradient_clip_norm: 1.0
  input_noise_std: 1.0
model:
  type: unet
  hidden_channels: 32
  target_mode: residual
  loss: mse
  mass_conserving: true
  fixed_land_cells: true
  depth: 3
rollout:
  autoregressive: true
  steps: null
  eval_interval_epochs: 5
  save_outputs: false
metrics:
  primary: eval_mse_mean
  definition: 'Mean over the full held-out rollout of layer-thickness MSE, computed by the
    fixed evaluator in src/evaluation.py. Lower is better.

    '
