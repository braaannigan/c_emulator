experiment:
  id: 20261016T064500-dgsw2l-convnext-unet
  acronym: dgsw2l
  family: double_gyre_shifting_wind_2layer
  summary: convnext-unet
  kind: bigger_jump
  rationale: 'Seven candidates without a new incumbent have changed capacity, horizon, inputs,
    drift control and time integration around the same 3x3-conv U-Net; none moved the 3-seed
    CUDA control (final 148.9, epochs 30-60 167.1). The backbone itself is the remaining untested
    axis. Samudra, the strongest published ConvNet ocean emulator, uses a U-Net of ConvNeXt
    blocks: 7x7 depthwise convolutions (each level sees ~2.3x further than two 3x3 convs),
    group normalisation and inverted-bottleneck MLPs with residual paths. At equal parameter
    count (1.93M vs 1.95M) this tests whether a better-conditioned, larger-kernel block improves
    mid-lead skill rather than just adding capacity, which over-fitted at depth 4.'
  hypothesis: Replacing the U-Net's 3x3 conv blocks with Samudra-style ConvNeXt blocks at
    equal parameter count, all else equal, lowers mid-lead error and gives a 3-seed final
    eval_mse_mean below 148.9 and a 3-seed epochs 30-60 mean below 167.1 by more than ~10,
    while staying bounded with KE and h-std ratios above 0.9.
  conclusion: null
paths:
  training_data: data/double_gyre_shifting_wind_2layer/train/20260408T071500-period40d-duration5000d-2layer.nc
  rollout_dir: data/double_gyre_shifting_wind_2layer/rollout/
  experiment_log: data/double_gyre_shifting_wind_2layer/logs/20261016T064500-dgsw2l-convnext-unet.json
  results_csv: data/double_gyre_shifting_wind_2layer/results.csv
runtime:
  seed: 42
  device: auto
  epochs: 60
  smoke_test_epochs: 1
split:
  method: chronological
  train_fraction: 0.8
  eval_fraction: 0.2
inputs:
  state_fields:
  - layer_thickness
  - zonal_velocity_centered
  - meridional_velocity_centered
  layers: 2
  conditioning_fields:
  - surface_wind_stress
  static_fields:
  - train_mean_state
  - coordinates
  - land_mask
training:
  batch_size: 8
  learning_rate: 0.0003
  unroll_steps: 8
  gradient_clip_norm: 1.0
  input_noise_std: 1.0
model:
  type: unet
  hidden_channels: 32
  target_mode: residual
  loss: mse
  mass_conserving: true
  fixed_land_cells: true
  depth: 3
  block: convnext
rollout:
  autoregressive: true
  steps: null
  eval_interval_epochs: 5
  save_outputs: false
metrics:
  primary: eval_mse_mean
  definition: 'Mean over the full held-out rollout of layer-thickness MSE, computed by the
    fixed evaluator in src/evaluation.py. Lower is better.

    '
