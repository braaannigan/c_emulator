experiment:
  id: 20261016T190000-dgsw2l-crps-4member
  acronym: dgsw2l
  family: double_gyre_shifting_wind_2layer
  summary: crps-4member
  kind: medium_step
  rationale: The CRPS incumbent estimates the fair CRPS from only two members per window,
    a noisy estimate of the spread term. Four members (same unroll, ~2x compute per step)
    give a lower-variance estimate of the ensemble spread and its gradient, which in the ensemble-weather
    literature improves member calibration. Objective refinement of the new incumbent, run
    as a single seed (seed 42) per the budget constraint; more seeds only if it beats the
    seed-42 incumbent run by more than ~6.
  hypothesis: 'A 4-member fair CRPS improves the seed-42 epochs 30-60 eval_mse_mean below
    ~138 (incumbent seed 42: 144.0; six-seed mean 145.4, seed sd ~3) and raises the KE ratio
    at the last step above 0.88, without worsening velocity MSE.'
  conclusion: Neutral, not adopted (single seed per budget rule). A 4-member fair CRPS (seed
    42) gives epochs 30-60 146.1, final 153.5, velocity MSE 0.00179, KE at the last step 0.90
    vs the CRPS incumbent's seed-42 run 144.0 / 147.6 / 0.00184 / 0.88 (six-seed mean 145.4,
    seed sd ~3). Inside one seed-sd on every metric, at 2x the run time (20 min). Two members
    already give an adequate CRPS gradient; no further seeds spent.
paths:
  training_data: data/double_gyre_shifting_wind_2layer/train/20260408T071500-period40d-duration5000d-2layer.nc
  rollout_dir: data/double_gyre_shifting_wind_2layer/rollout/
  experiment_log: data/double_gyre_shifting_wind_2layer/logs/20261016T190000-dgsw2l-crps-4member.json
  results_csv: data/double_gyre_shifting_wind_2layer/results.csv
runtime:
  seed: 42
  device: auto
  epochs: 60
  smoke_test_epochs: 1
split:
  method: chronological
  train_fraction: 0.8
  eval_fraction: 0.2
inputs:
  state_fields:
  - layer_thickness
  - zonal_velocity_centered
  - meridional_velocity_centered
  layers: 2
  conditioning_fields:
  - surface_wind_stress
  static_fields:
  - train_mean_state
  - coordinates
  - land_mask
training:
  batch_size: 8
  learning_rate: 0.0003
  unroll_steps: 8
  gradient_clip_norm: 1.0
  input_noise_std: 1.0
  ema_decay: 0.998
  loss: crps
  crps_members: 4
model:
  type: unet
  hidden_channels: 32
  target_mode: residual
  loss: mse
  mass_conserving: true
  fixed_land_cells: true
  depth: 3
  stochastic_channels: 4
rollout:
  autoregressive: true
  steps: null
  eval_interval_epochs: 5
  save_outputs: false
metrics:
  primary: eval_mse_mean
  definition: 'Mean over the full held-out rollout of layer-thickness MSE, computed by the
    fixed evaluator in src/evaluation.py. Lower is better.

    '
