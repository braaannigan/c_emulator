experiment:
  id: 20261016T160000-dgsw2l-crps-tuning-ch8
  acronym: dgsw2l
  family: double_gyre_shifting_wind_2layer
  summary: crps-tuning-ch8
  kind: tuning
  rationale: 'Follow-up tuning of the promising CRPS bigger_jump: with only 4 noise channels
    the generator may be under-dispersive (KE at the last step still 0.86); 8 channels give
    the network more independent randomness to express spread.'
  hypothesis: Compared with the CRPS incumbent's six seeds (epochs 30-60 145.4 +/- 1.3, final
    151.1 +/- 3.6, KE last 0.86), the change lowers the 3-seed epochs 30-60 mean below ~140
    or raises the KE ratio at the last step above 0.9 without worsening eval_mse_mean.
  conclusion: 'Neutral, not adopted (6-vs-6 seeds). 8 stochastic channels instead of 4: epochs
    30-60 148.3 +/- 2.6 vs 145.4 +/- 1.3; final 144.1 +/- 6.6 vs 151.1 +/- 3.6; velocity MSE
    0.00195 vs 0.00195; KE ratio at the last step 0.87 vs 0.86; step-20 MSE 16.1 vs 15.0.
    The promising 3-seed result (144.5 / 142.4) did not hold with seeds 11/19/23. Keep 4 channels.'
paths:
  training_data: data/double_gyre_shifting_wind_2layer/train/20260408T071500-period40d-duration5000d-2layer.nc
  rollout_dir: data/double_gyre_shifting_wind_2layer/rollout/
  experiment_log: data/double_gyre_shifting_wind_2layer/logs/20261016T160000-dgsw2l-crps-tuning-ch8.json
  results_csv: data/double_gyre_shifting_wind_2layer/results.csv
runtime:
  seed: 42
  device: auto
  epochs: 60
  smoke_test_epochs: 1
split:
  method: chronological
  train_fraction: 0.8
  eval_fraction: 0.2
inputs:
  state_fields:
  - layer_thickness
  - zonal_velocity_centered
  - meridional_velocity_centered
  layers: 2
  conditioning_fields:
  - surface_wind_stress
  static_fields:
  - train_mean_state
  - coordinates
  - land_mask
training:
  batch_size: 8
  learning_rate: 0.0003
  unroll_steps: 8
  gradient_clip_norm: 1.0
  input_noise_std: 1.0
  ema_decay: 0.998
  loss: crps
model:
  type: unet
  hidden_channels: 32
  target_mode: residual
  loss: mse
  mass_conserving: true
  fixed_land_cells: true
  depth: 3
  stochastic_channels: 8
rollout:
  autoregressive: true
  steps: null
  eval_interval_epochs: 5
  save_outputs: false
metrics:
  primary: eval_mse_mean
  definition: 'Mean over the full held-out rollout of layer-thickness MSE, computed by the
    fixed evaluator in src/evaluation.py. Lower is better.

    '
