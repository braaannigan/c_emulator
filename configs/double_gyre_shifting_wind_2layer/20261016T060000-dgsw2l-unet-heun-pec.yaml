experiment:
  id: 20261016T060000-dgsw2l-unet-heun-pec
  acronym: dgsw2l
  family: double_gyre_shifting_wind_2layer
  summary: unet-heun-pec
  kind: bigger_jump
  rationale: 'Six experiments without a new incumbent: capacity (depth 4), horizon (unroll
    16), inputs (wind pair, two-frame tendency) and drift control (climate nudging) all failed,
    while the CUDA control pins the incumbent at a 3-seed final mean of 148.9 / epochs 30-60
    mean 167.1. The remaining lever is mid-lead skill (steps 10-50), where error grows from
    ~13 to ~140. The literature review lists predictor-evaluator-corrector (PEC) integration
    as a stability and skill improvement for ocean emulators (OceanNet): treating the network
    as a tendency and integrating with a second-order Heun step makes the 7-day update a smoother,
    more accurate function of the state, which should slow error growth. It changes the time-integration
    formulation, not the backbone, and keeps land pinning and exact volume conservation.'
  hypothesis: Using a Heun predictor-corrector step (two U-Net evaluations per 7-day step)
    in the incumbent recipe lowers mid-lead error (step-10/20) and gives a 3-seed final eval_mse_mean
    below the CUDA control's 148.9 and a 3-seed epochs 30-60 mean below 167.1 by more than
    ~10, with KE and h-std ratios above 0.9.
  conclusion: 'Neutral, not promoted. Heun predictor-corrector integration (two U-Net evaluations
    per step, ~2x run time: 10-12 min on RTX 4090) gives 3-seed final eval_mse_mean 126.3
    / 132.1 / 180.3 (mean 146.2) vs the CUDA control''s 128.9 / 168.1 / 149.7 (mean 148.9),
    and 3-seed epochs 30-60 means 159.7 / 159.0 / 181.3 (mean 166.7) vs 167.1. Both differences
    are far inside the ~10-point standard error. Lead-time error and fidelity (KE 0.87-1.01,
    h-std 0.96-1.02) are also indistinguishable. Second-order time integration does not change
    the error growth: the learned one-step map was already smooth enough, and the chaotic
    divergence after ~20 steps is set by the dynamics, not the integrator. Not worth the 2x
    cost.'
paths:
  training_data: data/double_gyre_shifting_wind_2layer/train/20260408T071500-period40d-duration5000d-2layer.nc
  rollout_dir: data/double_gyre_shifting_wind_2layer/rollout/
  experiment_log: data/double_gyre_shifting_wind_2layer/logs/20261016T060000-dgsw2l-unet-heun-pec.json
  results_csv: data/double_gyre_shifting_wind_2layer/results.csv
runtime:
  seed: 42
  device: auto
  epochs: 60
  smoke_test_epochs: 1
split:
  method: chronological
  train_fraction: 0.8
  eval_fraction: 0.2
inputs:
  state_fields:
  - layer_thickness
  - zonal_velocity_centered
  - meridional_velocity_centered
  layers: 2
  conditioning_fields:
  - surface_wind_stress
  static_fields:
  - train_mean_state
  - coordinates
  - land_mask
training:
  batch_size: 8
  learning_rate: 0.0003
  unroll_steps: 8
  gradient_clip_norm: 1.0
  input_noise_std: 1.0
model:
  type: unet
  hidden_channels: 32
  target_mode: residual
  loss: mse
  mass_conserving: true
  fixed_land_cells: true
  depth: 3
  integrator: heun
rollout:
  autoregressive: true
  steps: null
  eval_interval_epochs: 5
  save_outputs: false
metrics:
  primary: eval_mse_mean
  definition: 'Mean over the full held-out rollout of layer-thickness MSE, computed by the
    fixed evaluator in src/evaluation.py. Lower is better.

    '
